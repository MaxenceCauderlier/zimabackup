name: zimabackup

services:
  app:
    image: "${ZIMABACKUP_IMAGE:-ghcr.io/maxencecauderlier/zimabackup:0.15.8}"
    restart: unless-stopped
    labels:
      org.zimabackup.internal: "true"
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      TZ: "${TZ:-Europe/Paris}"
      RESTIC_CACHE_DIR: /var/www/html/storage/cache/restic
    volumes:
      - "${ZIMABACKUP_STORAGE_PATH:-/DATA/AppData/ZimaBackup}:/var/www/html/storage"
      - "${ZIMABACKUP_DATA_PATH:-/DATA}:/DATA:ro"
      - "${ZIMABACKUP_MEDIA_PATH:-/media}:/media:ro"

  worker:
    image: "${ZIMABACKUP_IMAGE:-ghcr.io/maxencecauderlier/zimabackup:0.15.8}"
    restart: unless-stopped
    labels:
      org.zimabackup.internal: "true"
    command: ["php", "bin/worker.php"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      TZ: "${TZ:-Europe/Paris}"
      RESTIC_CACHE_DIR: /var/www/html/storage/cache/restic
      WORKER_INTERVAL: "${WORKER_INTERVAL:-5}"
      APP_DISCOVERY_INTERVAL: "${APP_DISCOVERY_INTERVAL:-120}"
      DOCKER_SOCKET: /var/run/docker.sock
      ZIMABACKUP_COMPOSE_PROJECT: zimabackup
      ZIMAOS_APPS_ROOT: /var/lib/casaos/apps
    volumes:
      - "${ZIMABACKUP_STORAGE_PATH:-/DATA/AppData/ZimaBackup}:/var/www/html/storage"
      - "${ZIMABACKUP_DATA_PATH:-/DATA}:/DATA"
      - "${ZIMABACKUP_MEDIA_PATH:-/media}:/media"
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - "${ZIMAOS_APPS_PATH:-/var/lib/casaos/apps}:/var/lib/casaos/apps:ro"
