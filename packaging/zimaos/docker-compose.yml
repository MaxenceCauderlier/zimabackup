name: zimabackup

services:
  zimabackup:
    image: ghcr.io/MaxenceCauderlier/zimabackup:0.15.1
    restart: unless-stopped
    labels:
      org.zimabackup.internal: "true"
    ports:
      - target: 80
        published: "8090"
        protocol: tcp
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      TZ: Europe/Paris
      RESTIC_CACHE_DIR: /var/www/html/storage/cache/restic
    volumes:
      - /DATA/AppData/ZimaBackup:/var/www/html/storage
      - /DATA:/DATA:ro
      - /media:/media:ro

  worker:
    image: ghcr.io/MaxenceCauderlier/zimabackup:0.15.1
    restart: unless-stopped
    labels:
      org.zimabackup.internal: "true"
    command: ["php", "bin/worker.php"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      TZ: Europe/Paris
      RESTIC_CACHE_DIR: /var/www/html/storage/cache/restic
      WORKER_INTERVAL: "5"
      APP_DISCOVERY_INTERVAL: "120"
      DOCKER_SOCKET: /var/run/docker.sock
      ZIMABACKUP_COMPOSE_PROJECT: zimabackup
      ZIMAOS_APPS_ROOT: /var/lib/casaos/apps
    volumes:
      - /DATA/AppData/ZimaBackup:/var/www/html/storage
      - /DATA:/DATA
      - /media:/media
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/casaos/apps:/var/lib/casaos/apps:ro

x-casaos:
  id: com.zimabackup.app
  main: zimabackup
  index: /
  port_map: "8090"
  scheme: http
  icon: https://raw.githubusercontent.com/MaxenceCauderlier/zimabackup/main/packaging/zimaos/icon.svg
  title:
    en_US: ZimaBackup
    fr_FR: ZimaBackup
  tagline:
    en_US: Application-aware backups and disaster recovery for ZimaOS.
    fr_FR: Sauvegardes applicatives et restauration après sinistre pour ZimaOS.
  description:
    en_US: Back up files and installed applications, keep encrypted recovery points, and restore application data from a simple ZimaOS-friendly interface.
    fr_FR: Sauvegardez vos fichiers et applications installées, conservez des points de récupération chiffrés et restaurez les données applicatives depuis une interface simple adaptée à ZimaOS.
  author: ZimaBackup
  developer: ZimaBackup
  category: Productivity
  architectures:
    - amd64
  version: "0.15.1"
  update_at: "2026-09-29"
  release_notes:
    en_US: GHCR distribution workflow, production image and ZimaOS installation compose.
    fr_FR: Publication GHCR, image de production et fichier Compose prêt pour une installation ZimaOS.
  repo: https://github.com/MaxenceCauderlier/zimabackup
  support: https://github.com/MaxenceCauderlier/zimabackup/issues
  docs: https://github.com/MaxenceCauderlier/zimabackup#readme
